# PROVISIONAL hardware measurements. Deep overlay on control.yaml only for hardware.
/**:
  ros__parameters:
    hardware_minimum_commands: true # [bool] Floors before collision_monitor; never boosts guard output.
    minimum_linear_command: 0.15 # PROVISIONAL [m/s command] Below this barely moves; zero remains zero.
    minimum_angular_command: 0.35 # PROVISIONAL [rad/s command] In-place only; preserve gentle curves while moving.
    reverse_speed_limit: 0.25 # [m/s command] Escape reverse command cap, 9 October.
    direct_forward_limit: 0.35 # PROVISIONAL [m/s command] Same as MPPI maximum.
    linear_compensation_threshold: 0.06 # PROVISIONAL [m/s] Strict lower threshold for linear boost/in-place classification.
    angular_compensation_threshold: 0.15 # PROVISIONAL [rad/s] Strict lower threshold for in-place yaw boost.
    look_turn_rate: 0.8 # PROVISIONAL [rad/s command] Spin must cross measured deadband; observe after stopping.
controller_server:
  ros__parameters:
    goal_checker_plugins: [goal_checker, staging_checker]
    staging_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.12 # [m] Floor tested staging arrival; no heading requirement.
      stateful: true
    progress_checker_plugins: [progress_checker]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10 # PROVISIONAL [m] Hardware-calibrated setting.
      required_movement_angle: 0.3 # PROVISIONAL [rad] Rotation counts as progress.
      movement_time_allowance: 30.0 # PROVISIONAL [s ROS] Person may block for 20 s.
    goal_checker:
      xy_goal_tolerance: 0.12 # [m] Hardware-calibrated setting.
      yaw_goal_tolerance: 0.25 # [rad] Hardware-calibrated setting.
    FollowPath:
      angular_dist_threshold: 1.05 # PROVISIONAL [rad] Shim only for sideways/backward paths.
      rotate_to_heading_angular_vel: 0.8 # PROVISIONAL [rad/s command] Requested minimum and existing navigation cap.
      max_angular_accel: 1.2 # PROVISIONAL [rad/s^2] .8 measured response slope * previous 1.5; command floor overrides ramp below breakaway.
      vx_max: 0.35 # PROVISIONAL [m/s] Hardware command cap; measured speed is about 0.65 of command.
      vx_min: 0.0 # [m/s] Stop allowed; hard moving minimum enforced before guard, not by forcing positive vx_min.
      wz_max: 0.8 # [rad/s] Preserve existing cap and allow required .8 command; no invented wz_min parameter.
      ax_max: 0.52 # PROVISIONAL [m/s^2] .65 response * previous .8; acceleration not separately measured.
      ax_min: -0.52 # PROVISIONAL [m/s^2] Conservative braking prediction; measure stop response.
      az_max: 1.2 # PROVISIONAL [rad/s^2] .8 slope * previous 1.5; validate transient yaw response.
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, PredictionCritic, VelocityDeadbandCritic]
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1 # [exponent] Installed Nav2 default.
        cost_weight: 35.0 # [cost weight] Installed Nav2 default.
        deadband_velocities: [0.15, 0.0, 0.0] # PROVISIONAL [m/s, m/s, rad/s] Linear deadband only; in-place yaw compensation is downstream.
behavior_server:
  ros__parameters:
    min_rotational_vel: 0.8 # PROVISIONAL [rad/s] Jazzy parameter is at server scope, not spin.min_rotational_vel.
    max_rotational_vel: 0.8 # [rad/s] Existing cap, unchanged.
    rotational_acc_lim: 1.2 # PROVISIONAL [rad/s^2] Same conservative angular response limit.

collision_monitor:
  ros__parameters:
    source_timeout: 1.0 # [s] Measured load condition: .518s scan age must not expire.
    polygons: [Approach, Stop] # Slow zone removed after floor validation; guard remains after executable-command compensation.
    Approach:
      time_before_collision: 0.6 # PROVISIONAL [s] Hardware-calibrated setting.
    Stop:
      type: polygon
      action_type: stop
      points: '[[0.1725,0.165],[0.1725,-0.165],[-0.1725,-0.165],[-0.1725,0.165]]' # [m] Nominal footprint + measured .05m backstop, active also during docking.
      min_points: 1 # [points] Existing threshold.
      visualize: true
      polygon_pub_topic: /control/hard_stop_polygon
