# Hardware profile overlays; 25W bring-up budget, PROVISIONAL until measured.
mapping_footprint_padding: 0.06 # PROVISIONAL [m] Stop .05m margin plus .01m planning allowance; mapping only.
mission_coordinator_rate: 5.0 # [Hz] Idle-load budget; matches planning tick and .6s request lease.
lifecycle:
  autostart: true
  bond_timeout: 20.0 # [s] User decision: tolerate startup load.
  attempt_respawn_reconnection: true
control:
  controller_server:
    ros__parameters:
      controller_frequency: 10.0 # [Hz] User decision, below observed 13 Hz achieved loop.
      transform_tolerance: 1.0 # [s] User TF-delay allowance.
      FollowPath:
        transform_tolerance: 1.0 # [s] RotationShim tolerance.
        model_dt: 0.1 # [s] Matches 10 Hz controller.
        time_steps: 28 # PROVISIONAL [steps] Preserve existing 2.8 s horizon while doubling dt.
        batch_size: 1000 # [trajectories] User load limit.
  local_costmap:
    local_costmap:
      ros__parameters:
        transform_tolerance: 1.0 # [s]
        update_frequency: 5.0 # [Hz]
        publish_frequency: 2.0 # [Hz]
        obstacle_layer:
          scan:
            min_obstacle_height: 0.0 # [m] Native layer lower bound; explicitly include elevated lidar.
            max_obstacle_height: 2.0 # [m] Native layer upper bound; Jazzy per-source default0 filters all elevated hits.
        inflation_layer:
          inflation_radius: 0.35 # [m] Hardware-calibrated clearance.
          cost_scaling_factor: 3.0 # [1/m] Hardware-calibrated clearance.
  bt_navigator:
    ros__parameters:
      transform_tolerance: 1.0 # [s]
      default_server_timeout: 1000 # [ms] Action goal acknowledgement.
      wait_for_service_timeout: 5000 # [ms] BT service discovery.
planning:
  global_costmap:
    global_costmap:
      ros__parameters:
        transform_tolerance: 1.0 # [s]
        update_frequency: 2.0 # PROVISIONAL [Hz] Keep dock admission's 1s freshness contract.
        publish_frequency: 2.0 # PROVISIONAL [Hz] 0.5Hz caused periodic stale-map cancellations every2s.
        obstacle_layer:
          scan:
            min_obstacle_height: 0.0 # [m] Native layer lower bound; explicitly include elevated lidar.
            max_obstacle_height: 2.0 # [m] Native layer upper bound; Jazzy per-source default0 filters all elevated hits.
        inflation_layer:
          inflation_radius: 0.35 # [m] Hardware-calibrated clearance.
          cost_scaling_factor: 3.0 # [1/m] Hardware-calibrated clearance.
slam:
  /**:
    ros__parameters:
      dock_standoff: 0.22 # [m] Floor-tested centre-to-wall goal; nominal front clearance .0975m.
  slam_toolbox:
    ros__parameters:
      transform_timeout: 0.5 # [s] User lookup allowance.
      map_update_interval: 3.0 # [s] User load budget.
      transform_publish_period: 0.05 # PROVISIONAL [s] 20 Hz TF, matching hardware odometry.
      restamp_tf: true # [bool] Installed slam_toolbox refreshes map->odom stamp between scan matches.
